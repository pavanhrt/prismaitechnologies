# PRISM AI — Netlify configuration
# Static site, no build step. Drag this folder into Netlify, or point
# a Git repo at it with the publish directory set to the repo root.

[build]
  publish = "."
  command = ""

# ----------------------------------------------------------------
# Caching
# Every CSS/JS URL in the HTML carries ?v=<content hash>, generated at
# build time. A changed file gets a new URL, so a long immutable cache
# is safe here: the browser can never serve a stale asset, because the
# stale URL is no longer referenced by any page.
#
# The HTML itself must NOT be cached, since it is what publishes the
# new hashes. That rule is below.
# ----------------------------------------------------------------
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML is the file that publishes the new asset hashes, so it must always
# be revalidated. Netlify already defaults HTML to this; these rules make
# it explicit and cover the clean-URL forms ("/", "/about", "/services/x")
# which do not match a "*.html" pattern.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/services/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----------------------------------------------------------------
# Security headers
# CSP allows Google Fonts only. If you add analytics or a chat widget
# later, its domain must be added here or the browser will block it.
# ----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'self'"

# ----------------------------------------------------------------
# Redirects
# Serve extensionless URLs (/about -> /about.html) so links stay
# tidy, and keep /services/<slug> working the same way.
# ----------------------------------------------------------------
[[redirects]]
  from = "/services/:slug"
  to = "/services/:slug.html"
  status = 200

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
